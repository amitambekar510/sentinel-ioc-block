name: Render README GIF
on:
  push:
    branches: [upgrade/ai-safe-v2]
    paths: ["scripts/render_gif.py", ".github/workflows/readme-gif.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - run: python scripts/render_gif.py
      - run: |
          git add assets/ioc-workflow.gif
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: render IOC review animation"
          git push
